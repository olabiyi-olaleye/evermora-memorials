name: DB migrate

# Pushes committed migrations to the linked Supabase project whenever a
# migration lands on `main`. The PR-time `database` job already proves every
# migration rebuilds the schema cleanly and that `db diff` is empty, so by the
# time a change is here it is safe to apply.
#
# Requires three repository secrets:
#   SUPABASE_ACCESS_TOKEN  — a personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   — the project's database password
#   SUPABASE_PROJECT_ID    — the project ref (e.g. xdbkhgwisjxosltimvpu)

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

# Never cancel a migration mid-run; queue instead.
concurrency:
  group: db-migrate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  push:
    name: Push migrations to Supabase
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}"

      - name: Show pending migrations
        run: supabase migration list --linked

      - name: Push
        run: supabase db push --linked
