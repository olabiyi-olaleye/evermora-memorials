name: Keep Supabase warm

# The free-tier Supabase project pauses after ~7 days without activity. A live
# app with real traffic keeps it awake; while this is only a test/demo
# environment, a light scheduled request every few days does the same so the
# deployed apps don't go dark after a quiet week.
#
# Delete this workflow once the project is on a paid plan (Pro projects do not
# auto-pause).
#
# Requires two repository secrets:
#   SUPABASE_URL       — https://<ref>.supabase.co
#   SUPABASE_ANON_KEY  — the project's anon key

on:
  schedule:
    - cron: "17 6 */3 * *" # every 3rd day, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    name: Ping REST API
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        run: |
          code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' \
            "${{ secrets.SUPABASE_URL }}/rest/v1/memorials?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "HTTP $code"
          case "$code" in
            200|206) echo "project is awake" ;;
            *) echo "::error::unexpected status $code"; exit 1 ;;
          esac
